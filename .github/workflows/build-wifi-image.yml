name: Build Wi-Fi Fixture Image

# The Wi-Fi fixture image is not a docker-compose service: the backend starts it on
# demand, so it is built out of band and pinned by tag, like the SDK and OTBR images.
# Pull requests only build it, to catch a broken Dockerfile. Publishing is a manual
# dispatch with `push` set, after which the new tag goes into DEFAULT_DOCKER_IMAGE in
# test_collections/matter/sdk_tests/support/wifi_container.py.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "wifi_container/**"
      - ".github/workflows/build-wifi-image.yml"
  workflow_dispatch:
    inputs:
      push:
        description: "Publish the image to ghcr.io"
        type: boolean
        default: false

jobs:
  build-wifi-image:
    name: Build Wi-Fi fixture image
    # arm64 is what the Test Harness runs on, so build there natively and emulate
    # the amd64 half of the multiarch build instead.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    env:
      PUSH: ${{ github.event_name == 'workflow_dispatch' && inputs.push }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Store wifi tag
        id: wifi_tag
        run: |
          echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Log in to Github Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if wifi image exists
        if: env.PUSH == 'true'
        id: check_tag_wifi
        env:
          IMAGE_NAME: "ghcr.io/${{ github.repository_owner }}/csa-certification-tool-wifi"
        run: |
          if docker manifest inspect $IMAGE_NAME:${{ steps.wifi_tag.outputs.tag }} > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        if: env.PUSH == 'true' && steps.check_tag_wifi.outputs.exists == 'false'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: env.PUSH == 'true' && steps.check_tag_wifi.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64, linux/arm64

      - name: Build wifi image
        if: env.PUSH != 'true'
        run: |
          ./wifi_container/scripts/build-docker-image.sh

      - name: Build and push wifi image
        if: env.PUSH == 'true' && steps.check_tag_wifi.outputs.exists == 'false'
        run: |
          ./wifi_container/scripts/build-docker-image.sh --push --multiarch
